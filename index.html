<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刘刘工厂 · 免费高质的食品</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============ 顶部 ============ */
  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid #f0f0f0;
  }

  .brand {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #1a1a1a;
  }

  .brand span {
    color: #e8722c;
  }

  .slogan {
    margin-top: 8px;
    font-size: 13px;
    color: #999;
    letter-spacing: 1.5px;
  }

  /* ============ 主体 ============ */
  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 22px 18px 40px;
  }

  .card {
    border: 1px solid #eeeeee;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.035);
  }

  /* 商品主图：正方形 */
  .card-media {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .media-fallback {
    display: none;
    font-size: 56px;
    user-select: none;
    color: #ddd;
  }

  .card-media.no-img img { display: none; }
  .card-media.no-img .media-fallback { display: block; }

  .card-body {
    padding: 18px 18px 20px;
  }

  .tag-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    color: #e8722c;
    background: #fff3e9;
    border-radius: 20px;
    padding: 3px 10px;
    letter-spacing: 0.5px;
  }

  .tag.gray {
    color: #888;
    background: #f6f6f6;
  }

  .product-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .product-desc {
    margin-top: 6px;
    font-size: 13px;
    color: #9a9a9a;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed #f0f0f0;
  }

  .price-symbol {
    font-size: 15px;
    color: #e8722c;
    font-weight: 600;
  }

  .price {
    font-size: 30px;
    font-weight: 700;
    color: #e8722c;
    letter-spacing: 0.5px;
  }

  .price-unit {
    font-size: 13px;
    color: #aaa;
  }

  /* ============ 数量 ============ */
  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }

  .qty-label {
    font-size: 14px;
    color: #666;
  }

  .qty-label small {
    display: block;
    font-size: 11px;
    color: #bbb;
    margin-top: 2px;
  }

  .stepper {
    display: flex;
    align-items: center;
    border: 1px solid #e6e6e6;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }

  .stepper button {
    width: 42px;
    height: 40px;
    border: none;
    background: #fafafa;
    font-size: 20px;
    color: #555;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    line-height: 1;
    font-family: inherit;
  }

  .stepper button:active {
    background: #f0f0f0;
  }

  .stepper button:disabled {
    color: #d8d8d8;
    cursor: not-allowed;
    background: #fcfcfc;
  }

  .stepper input {
    width: 50px;
    height: 40px;
    border: none;
    border-left: 1px solid #f0f0f0;
    border-right: 1px solid #f0f0f0;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    font-family: inherit;
    background: #fff;
    outline: none;
    -moz-appearance: textfield;
  }

  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* ============ 合计 ============ */
  .total-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #f4f4f4;
  }

  .total-label {
    font-size: 14px;
    color: #666;
  }

  .total-price {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .total-price em {
    font-style: normal;
    font-size: 14px;
    margin-right: 2px;
  }

  /* ============ 支付按钮 ============ */
  .pay-btns {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .pay-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    transition: transform 0.1s, opacity 0.2s;
  }

  .pay-btn:active {
    transform: scale(0.985);
    opacity: 0.9;
  }

  .pay-wechat {
    background: #07c160;
    color: #fff;
  }

  .pay-alipay {
    background: #1677ff;
    color: #fff;
  }

  .pay-btn .ico {
    font-size: 18px;
  }

  .notice {
    margin-top: 16px;
    font-size: 11px;
    color: #c4c4c4;
    text-align: center;
    line-height: 1.7;
  }

  /* ============ 自拍卡片 ============ */
  .selfie {
    margin-top: 20px;
    position: relative;
    border: 1px solid #eeeeee;
    border-radius: 16px;
    overflow: hidden;
    background-color: #fff;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.035);
  }

  .selfie::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.78);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .selfie-inner {
    position: relative;
    z-index: 1;
    padding: 24px 20px 22px;
    text-align: center;
  }

  .selfie-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #e8722c;
    background: #fff;
    border-radius: 20px;
    padding: 3px 12px;
    display: inline-block;
    margin-bottom: 14px;
    box-shadow: 0 1px 6px rgba(232, 114, 44, 0.12);
  }

  .avatar-wrap {
    width: 108px;
    height: 108px;
    margin: 0 auto 14px;
    border-radius: 50%;
    overflow: hidden;
    background: #f7f7f7;
    border: 3px solid #fff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
  }

  .avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar-fallback {
    display: none;
    line-height: 1;
  }

  .avatar-wrap.no-img img { display: none; }
  .avatar-wrap.no-img .avatar-fallback { display: block; }

  .selfie-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .selfie-name span {
    font-weight: 400;
    font-size: 12px;
    color: #aaa;
    letter-spacing: 0.5px;
    margin-left: 6px;
  }

  .selfie-say {
    margin-top: 8px;
    font-size: 13px;
    color: #888;
    line-height: 1.7;
  }

  /* ============ 页脚 ============ */
  footer {
    padding: 20px;
    text-align: center;
    font-size: 11px;
    color: #ccc;
    border-top: 1px solid #f6f6f6;
  }

  /* ============ 弹窗 ============ */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
    z-index: 99;
  }

  .mask.show {
    opacity: 1;
    visibility: visible;
  }

  .dialog {
    background: #fff;
    border-radius: 18px;
    padding: 28px 22px 0;
    width: 100%;
    max-width: 320px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.24s cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  .mask.show .dialog {
    transform: scale(1);
  }

  .dialog-emoji {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 14px;
  }

  .dialog-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .dialog-text {
    font-size: 13.5px;
    color: #888;
    line-height: 1.75;
    padding-bottom: 22px;
  }

  .dialog-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-top: 1px solid #f0f0f0;
    background: none;
    font-size: 16px;
    font-weight: 600;
    color: #e8722c;
    cursor: pointer;
    font-family: inherit;
  }

  .dialog-btn:active {
    background: #fafafa;
  }

  /* ============ 桌面端适配 ============ */
  @media (min-width: 768px) {
    header { padding: 44px 20px 28px; }
    .brand { font-size: 32px; }
    .slogan { font-size: 14px; }
    main { padding: 40px 20px 60px; }
    .card-body { padding: 24px 26px 26px; }
    .product-name { font-size: 23px; }
    .price { font-size: 34px; }
    .pay-btns { flex-direction: row; }
    .pay-btn { flex: 1; }
    .selfie-inner { padding: 28px 26px 26px; }
    .avatar-wrap { width: 128px; height: 128px; font-size: 50px; }
    .selfie-name { font-size: 17px; }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">刘刘<span>工厂</span></div>
    <div class="slogan">高质的食品</div>
  </header>

  <main>
    <div class="card">
      <!-- 商品主图：正方形，特殊商品 -->
      <div class="card-media">
        <img src="cz2.png" alt="陈子的**"
             onerror="this.parentNode.classList.add('no-img')">
        <span class="media-fallback">📦</span>
      </div>

      <div class="card-body">
        <div class="tag-row">
          <span class="tag">特殊商品</span>
          <span class="tag gray">整箱装</span>
        </div>

        <div class="product-name">陈子的**</div>
        <div class="product-desc">一箱 20 个 · 特殊商品 · 包邮到家</div>

        <div class="price-row">
          <span class="price-symbol">¥</span>
          <span class="price">10,000</span>
          <span class="price-unit">/ 箱</span>
        </div>

        <div class="qty-row">
          <div class="qty-label">
            购买数量
            <small>最多 20 箱</small>
          </div>
          <div class="stepper">
            <button type="button" id="minus" aria-label="减少">−</button>
            <input type="number" id="qty" value="1" min="1" max="20" readonly>
            <button type="button" id="plus" aria-label="增加">+</button>
          </div>
        </div>

        <div class="total-row">
          <span class="total-label">合计</span>
          <span class="total-price"><em>¥</em><span id="total">10,000</span></span>
        </div>

        <div class="pay-btns">
          <button class="pay-btn pay-wechat" data-pay="微信">
            <span class="ico">💬</span> 微信支付
          </button>
          <button class="pay-btn pay-alipay" data-pay="支付宝">
            <span class="ico">💳</span> 支付宝支付
          </button>
        </div>

        <div class="notice">
          下单后 48 小时内发货 · 支持七天无理由退换
        </div>
      </div>
    </div>

    <!-- 刘刘的自拍 -->
    <section class="selfie">
      <div class="selfie-inner">
        <div class="selfie-label">主理人自拍</div>
        <div class="avatar-wrap">
          <img src="ll.png" alt="刘刘的自拍照"
               onerror="this.parentNode.classList.add('no-img')">
          <span class="avatar-fallback">67</span>
        </div>
        <div class="selfie-name">刘刘 <span>工厂主理人</span></div>
        <div class="selfie-say">“每一样都是我自己一个一个挑的，放心。”</div>
      </div>
    </section>

    <!-- 陈子的自拍 -->
    <section class="selfie">
      <div class="selfie-inner">
        <div class="selfie-label">陈子的自拍</div>
        <div class="avatar-wrap">
          <img src="cz.png" alt="陈子的自拍照"
               onerror="this.parentNode.classList.add('no-img')">
          <span class="avatar-fallback">67</span>
        </div>
        <div class="selfie-name">陈子 <span> 店铺本尊</span></div>
        <div class="selfie-say">“20 个一箱，一个不多，一个不少。”</div>
      </div>
    </section>
  </main>

  <footer>© 2025 刘刘工厂 · 保留所有权利</footer>

  <!-- 弹窗 -->
  <div class="mask" id="mask">
    <div class="dialog">
      <div class="dialog-emoji">😄</div>
      <div class="dialog-title">哎呀，别当真～</div>
      <div class="dialog-text">
        这个网站只是图个乐意，<br>
        你真要去支付啊？那是不可能的。
      </div>
      <button class="dialog-btn" id="dialogClose">哈哈，知道了</button>
    </div>
  </div>

<script>
  (function () {
    var MAX = 20;
    var UNIT = 10000;

    var qtyInput = document.getElementById('qty');
    var minusBtn = document.getElementById('minus');
    var plusBtn  = document.getElementById('plus');
    var totalEl  = document.getElementById('total');
    var mask     = document.getElementById('mask');

    function formatNumber(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function render() {
      var q = parseInt(qtyInput.value, 10) || 1;
      if (q < 1) q = 1;
      if (q > MAX) q = MAX;
      qtyInput.value = q;

      totalEl.textContent = formatNumber(q * UNIT);

      minusBtn.disabled = (q <= 1);
      plusBtn.disabled  = (q >= MAX);
    }

    minusBtn.addEventListener('click', function () {
      qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);
      render();
    });

    plusBtn.addEventListener('click', function () {
      qtyInput.value = Math.min(MAX, (parseInt(qtyInput.value, 10) || 1) + 1);
      render();
    });

    // 支付按钮 —— 一律弹提示
    var payBtns = document.querySelectorAll('.pay-btn');
    for (var i = 0; i < payBtns.length; i++) {
      payBtns[i].addEventListener('click', function () {
        mask.classList.add('show');
      });
    }

    document.getElementById('dialogClose').addEventListener('click', function () {
      mask.classList.remove('show');
    });

    mask.addEventListener('click', function (e) {
      if (e.target === mask) mask.classList.remove('show');
    });

    render();
  })();
</script>
</body>
</html>
